/**
 * 2. 联合国队列要素预测算法 (Cohort-Component Projection)
 */
function runCohortComponentProjection(history) {
    const lastHist = history[history.length - 1];
    const startYear = lastHist.year;
    const endYear = 2100;

    // 建立出生历史队列数组
    let birthSeries = history.map(h => h.births);
    
    // 初始化返回数据（包含历史）
    const result = history.map(h => {
        const y = h.year;
        // 基于历史出生估算当前15-64岁与65岁+
        const workBirths = history.filter(x => x.year >= y - 64 && x.year <= y - 15).reduce((s,i)=>s+i.births,0);
        const oldBirths = history.filter(x => x.year >= y - 85 && x.year < y - 65).reduce((s,i)=>s+i.births,0);
        return {
            ...h,
            isPredict: false,
            workingPop: Math.round(workBirths * 0.92),
            elderlyPop: Math.round(oldBirths * 0.76)
        };
    });

    let currentPop = lastHist.pop;

    // 联合国中方案设定：总和生育率(TFR)将在2030年前后筑底(1.0-1.1)，随后缓慢回升并稳定在1.2-1.3左右
    for (let yr = startYear + 1; yr <= endYear; yr++) {
        const t = yr - startYear;

        // A. 动态计算育龄妇女规模 (15-49岁女性，假设男女出生性别比为 108:100)
        // 提取过去 15 至 49 年前的出生人口总量
        const childbearingAgeBirths = birthSeries.slice(-49, -15);
        const totalWomenInAge = (childbearingAgeBirths.reduce((a,b)=>a+b, 0) * (100 / 208)) * 0.95; // 考虑存活率
        
        // B. 生育率演变模型 (TFR 动态调整因子)
        // 2025-2035: 低位筑底震荡；2035后随着政策与社会支持微幅回升并趋稳定
        let tfrTarget = 1.05;
        if (yr > 2035) {
            tfrTarget = 1.05 + Math.min(0.20, (yr - 2035) * 0.005); // 渐进回升至 1.25 左右
        }

        // C. 动态推算出生人口 (无硬编码保底)
        // 育龄妇女平均生育窗口按35年计算
        let predictedBirths = (totalWomenInAge / 35) * tfrTarget;
        predictedBirths = Math.round(predictedBirths);

        // D. 动态死亡率推算 (基于“婴儿潮老龄化”与生命表存活率模型)
        // 1960-1970高出生高峰群将在 2030-2055 年进入高高龄死亡期
        let crudeDeathRate = 0.0082; 
        if (yr >= 2026 && yr <= 2050) {
            crudeDeathRate += (yr - 2025) * 0.00028; // 死亡人口达到峰值 (1300万-1500万/年)
        } else if (yr > 2050 && yr <= 2075) {
            crudeDeathRate = 0.0152 - (yr - 2050) * 0.00015; // 峰值过后逐渐回落
        } else if (yr > 2075) {
            crudeDeathRate = 0.0115; // 远期进入新平衡态
        }

        let predictedDead = Math.round(currentPop * crudeDeathRate);

        // E. 总人口迭代
        currentPop = currentPop + predictedBirths - predictedDead;
        birthSeries.push(predictedBirths);

        // F. 结构计算 (劳动力 15-64 岁 & 老年 65岁+)
        const workAgeBirths = birthSeries.slice(-64, -15).reduce((a,b)=>a+b, 0);
        const oldAgeBirths = birthSeries.slice(-85, -65).reduce((a,b)=>a+b, 0);

        result.push({
            year: yr,
            births: predictedBirths,
            dead: predictedDead,
            pop: Math.round(currentPop * 100) / 100,
            workingPop: Math.round(workAgeBirths * 0.90),
            elderlyPop: Math.round(oldAgeBirths * 0.72),
            isPredict: true
        });
    }

    return result;
}

// 视图渲染
function renderUI() {

    new Chart(ctx2, {

            interaction: { mode: 'index', intersect: false },
            plugins: {
                title: { display: true, text: '劳动力供给与老龄化人口趋势 (1949-2100)' }
            },
            scales: {
                y: { title: { display: true, text: '人口数量 (万人)' } }
            }
        }

}
